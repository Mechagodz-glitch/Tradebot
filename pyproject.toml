[project]
name = "tradebot"
version = "0.1.0"
description = "Deterministic execution layer for paper and live trading across US equities, Indian equities, and crypto."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "ccxt>=4.3",
  "kiteconnect>=5.0",
  "alpaca-py>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
tradebot = "tradebot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.setuptools.package-data]
"tradebot.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
